# Local development database only. Production infrastructure is provided by the client's deployment team.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gdrive
      POSTGRES_PASSWORD: gdrive
      POSTGRES_DB: gdrive
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
